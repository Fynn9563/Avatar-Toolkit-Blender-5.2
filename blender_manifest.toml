# blender_manifest.toml

schema_version = "1.0.0"

id = "avatar_toolkit"
version = "0.5.7"
name = "Avatar Toolkit"
tagline = "Import and optimize avatars for VRChat and Resonite"

maintainer = "Fynn9563"
type = "add-on"

blender_version_min = "5.0.0"
blender_version_max = "5.3.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

wheels = [
  "./wheels/lz4-4.4.5-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/lz4-4.4.5-cp313-cp313-macosx_10_13_x86_64.whl",
  "./wheels/lz4-4.4.5-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl",
  "./wheels/lz4-4.4.5-cp313-cp313-win_amd64.whl"
]

[permissions]
network = "For the auto updater to work, you need to allow network access"
files = "Import/Export files, saving atlas images, saving preferences"

[build]
paths_exclude_pattern = [".validation/", "tests/", "__pycache__/", "*.pyc", "*.zip", ".git/", ".gitignore", ".github/"]
